spring:
  application:
    name: care-ride
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/care_ride?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

security:
  jwt:
    secret: ${JWT_SECRET:}

logging:
  level:
    com.careride: INFO
