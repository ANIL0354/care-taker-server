debug: true

spring:
  application:
    name: care-ride
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: care-ride

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

security:
  jwt:
    secret: ${JWT_SECRET:}

logging:
  level:
    com.careride: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
