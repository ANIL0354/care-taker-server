services:
  app:
    build: .
    container_name: careride-app
    environment:
      DB_URL: "${DB_URL:-jdbc:postgresql://ep-small-sunset-biow9eic-pooler.c-5.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require}"
      DB_USERNAME: "${DB_USERNAME:-neondb_owner}"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRATION_MS: "${JWT_EXPIRATION_MS:-3600000}"
    ports:
      - "8080:8080"
